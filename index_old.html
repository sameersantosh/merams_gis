    /* STYLE F */

.checkbox.style-f {
  display: inline-block;
  position: relative;
  padding-left: 30px;
  cursor: pointer;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
.checkbox.style-f input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
  height: 0;
  width: 0;
}
.checkbox.style-f input:checked ~ .checkbox__checkmark {
  background-color: #eee;
}
.checkbox.style-f input:checked ~ .checkbox__checkmark:after {
  transform: scale(1);
}
.checkbox.style-f input:checked ~ .checkbox__body {
  font-weight: bold;
}
.checkbox.style-f:hover input ~ .checkbox__checkmark {
  background-color: #eee;
}
.checkbox.style-f:hover input:checked ~ .checkbox__checkmark {
  background-color: #eee;
}
.checkbox.style-f .checkbox__checkmark {
  position: absolute;
  top: 1px;
  left: 0;
  height: 22px;
  width: 22px;
  background-color: #eee;
  transition: background-color 0.25s ease;
  border-radius: 11px;
}
.checkbox.style-f .checkbox__checkmark:after {
  content: "";
  position: absolute;
  left: 0px;
  top: 0px;
  width: 22px;
  height: 22px;
  display: block;
  background-color: #f7cb15;
  border-radius: 50%;
  transform: scale(0);
  transition: transform 0.25s ease;
}
.checkbox.style-f .checkbox__body {
  color: #333;
  line-height: 1.4;
  font-size: 16px;
  transition: font-weight 0.25s ease;
}
  
  </style>
